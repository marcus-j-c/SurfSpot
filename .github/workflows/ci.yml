name: Java CI, Maven

on:
    push:
        branches: [main, "feature/*"]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: maven

            - name: Allow to execute
              run: chmod +x backend/mvnw

            - name: Run Tests
              working-directory: backend
              run: ./mvnw test -Dtest=SurfCacheServiceTest
